services:
  - type: web
    name: truthlens-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ALLOW_ALL_ORIGINS
        value: "true"
    healthCheckPath: /health
